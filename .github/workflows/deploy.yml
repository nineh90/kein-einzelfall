# Aktualisiert die Demo unter https://kein-einzelfall.nils-digital.de,
# sobald etwas auf main landet.
#
# Gebaut wird auf dem VPS, nicht hier: Das Skript /docker/kein-einzelfall/deploy.sh
# holt den aktuellen Stand, baut das Image, wandert die Datenbank und tauscht die
# Container. Dieser Workflow stoesst es nur an.
#
# Der hinterlegte Schluessel kann auf dem Server ausschliesslich dieses eine
# Skript ausfuehren (erzwungener Befehl in authorized_keys) - eine Shell
# bekommt man damit nicht.
name: Demo deployen

on:
  push:
    branches: [main]
  workflow_dispatch:

# Zwei gleichzeitige Deploys wuerden sich beim Bauen in die Quere kommen.
concurrency:
  group: demo-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH vorbereiten
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy anstossen
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            "root@${{ secrets.VPS_HOST }}" deploy
